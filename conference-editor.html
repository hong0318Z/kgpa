<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학술대회 페이지 에디터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cp:#185FA5;--cp-bg:#E6F1FB;--cp-lt:#B5D4F4;
  --cs:#3B6D11;--cs-bg:#EAF3DE;
  --ct:#1a1a1a;--cts:#5f5e5a;--cth:#888780;
  --cbg:#f5f5f3;--cw:#fff;--cbs:#f1efe8;
  --cb:#e0ded6;--cbs2:#c8c6be;
  --rsm:6px;--rmd:8px;--rlg:12px;
  --ed:#161622;--ep:#1e1e2e;--es:#252538;
  --eb:#32324a;--et:#ddddf0;--ets:#8888b0;
  --ea:#7c6af7;--eah:#6a58e0;--eab:#2e2850;--ei:#12121e;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:var(--ed);color:var(--et);display:flex;flex-direction:column}

/* ── TOOLBAR ── */
.toolbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1rem;background:var(--ep);border-bottom:1px solid var(--eb);flex-shrink:0;gap:8px}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.tb-brand{display:flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;color:var(--ea);white-space:nowrap;flex-shrink:0}
.folder-chip{display:flex;align-items:center;gap:5px;background:var(--eab);border:1px solid var(--eb);border-radius:6px;padding:3px 9px;font-size:.72rem;color:var(--ets);cursor:pointer;transition:all .15s;min-width:0;overflow:hidden}
.folder-chip:hover{border-color:var(--ea);color:var(--ea)}
.folder-chip i{flex-shrink:0}
.folder-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.folder-chip.ok{color:#5dbf78;border-color:#2e5040;background:#1a2e20}
.folder-chip.stale{color:#c9922a;border-color:#4a3510;background:#251c08}
.tb-right{display:flex;gap:6px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:6px;font-size:.78rem;font-family:inherit;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--ea);color:#fff}.btn-p:hover{background:var(--eah)}
.btn-g{background:transparent;color:var(--ets);border:1px solid var(--eb)}.btn-g:hover{border-color:var(--ea);color:var(--ea)}
.btn-view{display:none}

/* ── WORKSPACE ── */
.workspace{flex:1;display:flex;overflow:hidden}
.preview-pane{flex:1;overflow-y:auto;background:var(--cbg);scrollbar-width:thin}
.editor-pane{width:400px;flex-shrink:0;display:flex;flex-direction:column;background:var(--ep);border-left:1px solid var(--eb)}

/* ── TABS ── */
.tab-strip{display:flex;overflow-x:auto;border-bottom:1px solid var(--eb);flex-shrink:0}
.tab-strip::-webkit-scrollbar{height:2px}.tab-strip::-webkit-scrollbar-thumb{background:var(--ea)}
.stab{flex-shrink:0;padding:10px 11px;font-size:.75rem;font-family:inherit;color:var(--ets);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.stab:hover{color:var(--et)}.stab.active{color:var(--ea);border-bottom-color:var(--ea)}
.form-scroll{flex:1;overflow-y:auto;padding:1rem;scrollbar-width:thin}

/* ── FORM ── */
.fg{margin-bottom:.8rem}
.fg label{display:block;font-size:.7rem;font-weight:700;color:var(--ets);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fg input[type=text],.fg input[type=email],.fg input[type=url],.fg textarea{width:100%;background:var(--ei);border:1px solid var(--eb);border-radius:6px;color:var(--et);font-family:inherit;font-size:.82rem;padding:7px 10px;outline:none;transition:border-color .15s}
.fg input:focus,.fg textarea:focus{border-color:var(--ea)}
.fg textarea{resize:vertical;min-height:70px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── IMAGE INPUT WIDGET ── */
.img-widget{border:1px solid var(--eb);border-radius:8px;padding:.7rem;background:var(--ei)}
.img-widget-row{display:flex;align-items:center;gap:6px;margin-bottom:.5rem}
.img-widget-row input{flex:1;background:var(--ed);border:1px solid var(--eb);border-radius:5px;color:var(--et);font-family:inherit;font-size:.78rem;padding:5px 8px;outline:none}
.img-widget-row input:focus{border-color:var(--ea)}
.img-or{font-size:.68rem;color:var(--ets);flex-shrink:0}
.file-pick{position:relative;border:1px dashed var(--eb);border-radius:5px;padding:6px 8px;text-align:center;cursor:pointer;transition:border-color .15s;overflow:hidden}
.file-pick:hover{border-color:var(--ea)}
.file-pick input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;width:100%;height:100%}
.file-pick-lbl{font-size:.72rem;color:var(--ets);pointer-events:none;display:flex;align-items:center;justify-content:center;gap:4px}
.img-preview{margin-top:.4rem;position:relative;display:inline-block}
.img-preview img{max-height:72px;max-width:100%;border-radius:5px;border:1px solid var(--eb);object-fit:cover;display:block}
.img-preview-del{position:absolute;top:-6px;right:-6px;background:#e05050;border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ftag{display:inline-flex;align-items:center;gap:3px;background:var(--eab);color:var(--ea);padding:2px 7px;border-radius:4px;font-size:.7rem;margin-top:3px}
.folder-hint{font-size:.68rem;color:var(--ets);margin-top:.3rem;opacity:.8}

/* ── ITEM CARDS ── */
.icard{background:var(--es);border:1px solid var(--eb);border-radius:8px;padding:.7rem;margin-bottom:.55rem}
.icard-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.icard-num{font-size:.7rem;font-weight:700;color:var(--ea);text-transform:uppercase}
.icard-actions{display:flex;gap:3px}
.ibtn{background:transparent;border:none;color:var(--ets);cursor:pointer;padding:3px 5px;border-radius:4px;font-size:.75rem;display:flex;align-items:center;transition:all .15s}
.ibtn:hover{background:var(--eb);color:var(--et)}.ibtn.del:hover{background:#3d1515;color:#e05050}
.add-btn{width:100%;padding:7px;background:transparent;border:1px dashed var(--eb);border-radius:6px;color:var(--ets);font-family:inherit;font-size:.76rem;cursor:pointer;transition:all .15s;margin-top:.4rem}
.add-btn:hover{border-color:var(--ea);color:var(--ea)}
.sep{height:1px;background:var(--eb);margin:.75rem 0}
.sub-hd{font-size:.68rem;font-weight:700;color:var(--ets);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.55rem}
.help-txt{font-size:.72rem;color:var(--ets);margin-bottom:.7rem;line-height:1.6;opacity:.85}

/* ── PHOTO GRID EDITOR ── */
.pgrid-ed{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.pthumb{aspect-ratio:1;border-radius:4px;overflow:hidden;position:relative;background:var(--ei)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);border:none;border-radius:3px;color:#fff;font-size:9px;padding:1px 4px;cursor:pointer;opacity:0;transition:opacity .15s}
.pthumb:hover .pthumb-del{opacity:1}

/* ══════════════════════════════════════════════
   CONFERENCE PAGE (preview)
══════════════════════════════════════════════ */
#preview{font-family:'Noto Sans KR',sans-serif;font-size:16px;line-height:1.7;color:var(--ct);background:var(--cbg)}
#preview .p-nav{background:var(--cw);border-bottom:1px solid var(--cb);position:sticky;top:0;z-index:50;padding:0 2rem}
#preview .p-nav-inner{max-width:920px;margin:0 auto;display:flex;overflow-x:auto}
#preview .p-nav-inner a{padding:.9rem 1.1rem;font-size:.86rem;color:var(--cts);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
#preview .p-nav-inner a:hover,#preview .p-nav-inner a.active{color:var(--ct);border-bottom-color:var(--cp)}
#preview .p-con{max-width:920px;margin:0 auto;padding:3rem 2rem}
#preview .p-div{height:1px;background:var(--cb);margin:0 2rem}
#preview .p-slabel{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--cp);text-transform:uppercase;margin-bottom:4px}
#preview .p-stitle{font-size:1.5rem;font-weight:500;margin-bottom:1.8rem}

/* Hero */
#preview .p-hero{background:var(--cw);border-bottom:1px solid var(--cb);padding:4rem 2rem 3rem;text-align:center}
#preview .p-badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--cp);background:var(--cp-bg);padding:5px 16px;border-radius:20px;margin-bottom:1.2rem}
#preview .p-hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.3;margin-bottom:.6rem}
#preview .p-hero-sub{font-size:1rem;color:var(--cts);margin-bottom:2rem}
#preview .p-hero-meta{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;margin-bottom:2rem}
#preview .p-hero-meta span{font-size:.88rem;color:var(--cts);display:flex;align-items:center;gap:5px}
#preview .p-hero-img{max-width:860px;margin:0 auto}
/* 자연 높이 — width 100%, height auto */
#preview .p-hero-img img{width:100%;height:auto;border-radius:var(--rlg);border:1px solid var(--cb);display:block}
#preview .p-hero-ph{width:100%;height:160px;background:linear-gradient(135deg,var(--cp-bg),var(--cp-lt));border-radius:var(--rlg);border:1px dashed var(--cp-lt);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cp);gap:6px;font-size:.82rem;opacity:.7}

/* Greeting */
#preview .p-greeting{background:var(--cw);border:1px solid var(--cb);border-radius:var(--rlg);padding:2rem;display:grid;grid-template-columns:1fr 160px;gap:2rem;margin-bottom:1.2rem}
#preview .p-greeting:last-child{margin-bottom:0}
#preview .p-gbody{font-family:'Noto Serif KR',serif;font-size:.92rem;color:var(--cts);line-height:2}
#preview .p-ginfo{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:.5rem}
#preview .p-avatar{width:88px;height:88px;border-radius:50%;background:var(--cp-bg);border:1px solid var(--cp-lt);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--cp);margin-bottom:.8rem;overflow:hidden;flex-shrink:0}
#preview .p-avatar img{width:100%;height:100%;object-fit:cover}
#preview .p-gname{font-size:.92rem;font-weight:700;margin-bottom:4px}
#preview .p-gorg{font-size:.78rem;color:var(--cts);line-height:1.5}

/* Keynote item */
#preview .p-item{background:var(--cw);border:1px solid var(--cb);border-radius:var(--rmd);padding:1rem 1.25rem;margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;transition:border-color .2s}
#preview .p-item:last-child{margin-bottom:0}
#preview .p-item:hover{border-color:var(--cbs2)}
#preview .p-item.clickable{cursor:pointer}
#preview .p-item.clickable:hover{border-color:var(--cp);background:var(--cp-bg)}
#preview .p-ititle{font-size:.94rem;font-weight:500;margin-bottom:4px}
#preview .p-iauthors{font-size:.8rem;color:var(--cts)}
#preview .p-iright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
#preview .p-itime{font-size:.8rem;color:var(--cth);white-space:nowrap}
#preview .p-fbadge{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--cp);background:var(--cp-bg);padding:2px 7px;border-radius:4px}

/* Poster */
#preview .p-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
#preview .p-pcard{background:var(--cw);border:1px solid var(--cb);border-radius:var(--rmd);padding:1rem 1.1rem;transition:all .2s}
#preview .p-pcard.clickable{cursor:pointer}
#preview .p-pcard.clickable:hover{border-color:var(--cp);background:var(--cp-bg)}
#preview .p-pnum{font-size:11px;font-weight:700;color:var(--cs);margin-bottom:6px;letter-spacing:.05em}
#preview .p-ptitle{font-size:.86rem;font-weight:500;line-height:1.5;margin-bottom:8px}
#preview .p-pauthor{font-size:.78rem;color:var(--cts)}
/* Award badges */
#preview .p-pcard.award-best{border-color:#c9a227!important;border-width:2px}
#preview .p-pcard.award-great{border-color:#9e9e9e!important;border-width:2px}
#preview .p-pcard.award-encour{border-color:#cd7f32!important;border-width:2px}
#preview .p-award-badge{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:6px}
#preview .p-award-badge.best{background:#fff8dc;color:#8a6800}
#preview .p-award-badge.great{background:#f0f0f0;color:#555}
#preview .p-award-badge.encour{background:#fdf0e8;color:#8b4513}
/* PDF / Image preview thumbnails */
#preview .p-item.has-prev{flex-direction:column;padding:0;gap:0;align-items:stretch}
#preview .p-item-prev{width:100%;aspect-ratio:16/9;overflow:hidden;background:#111;position:relative;border-radius:var(--rmd) var(--rmd) 0 0}
#preview .p-item-prev canvas,#preview .p-item-prev img{width:100%;height:100%;object-fit:contain;display:block}
#preview .p-item-info{padding:.9rem 1.25rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;width:100%}
#preview .p-pcard.has-prev{padding:0}
#preview .p-pcard-prev{width:100%;aspect-ratio:3/4;overflow:hidden;background:#e8e8e8;position:relative;border-radius:var(--rmd) var(--rmd) 0 0}
#preview .p-pcard-prev canvas{width:100%;height:auto;display:block}
#preview .p-pcard-prev img{width:100%;height:100%;object-fit:contain;display:block}
#preview .p-pcard-info{padding:.9rem 1.1rem}
#preview .p-thumb-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none}
#preview .p-thumb-ph i{font-size:2rem;opacity:.25}
#preview .p-thumb-ph span{font-size:.7rem;color:#aaa}

/* Sketch */
#preview .p-sk-ph{text-align:center;padding:3.5rem 2rem;background:var(--cw);border:1px dashed var(--cb);border-radius:var(--rlg);color:var(--cts)}
#preview .p-sk-ph i{font-size:2.5rem;opacity:.25;display:block;margin-bottom:.8rem}
#preview .p-photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
#preview .p-photo-item{border-radius:var(--rmd);overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:var(--cbs);position:relative}
#preview .p-photo-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
#preview .p-photo-item:hover img{transform:scale(1.04)}
#preview .p-photo-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);color:#fff;font-size:.75rem;padding:1rem .6rem .5rem;opacity:0;transition:opacity .2s}
#preview .p-photo-item:hover .p-photo-cap{opacity:1}

/* Footer */
#preview .p-footer{background:var(--cw);border-top:1px solid var(--cb);padding:2rem;text-align:center;font-size:.83rem;color:var(--cts)}
#preview .p-footer a{color:var(--cp);text-decoration:none}

/* ── MODALS ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.fmodal{background:#fff;border-radius:12px;overflow:hidden;width:min(900px,92vw);max-height:90vh;display:flex;flex-direction:column}
.fmodal-hd{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;border-bottom:1px solid var(--cb);flex-shrink:0}
.fmodal-title{font-size:.88rem;font-weight:600;color:var(--ct)}
.fmodal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--cts);display:flex;align-items:center;padding:4px;border-radius:4px}
.fmodal-close:hover{background:var(--cbs)}
.fmodal-body{flex:1;overflow:hidden;min-height:200px}
.fmodal-body iframe{width:100%;height:70vh;border:none;display:block}
.fmodal-dl{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;gap:1rem;min-height:250px;color:var(--cts)}
.fmodal-dl i{font-size:3rem;color:var(--cp)}
.fmodal-dl p{font-size:.88rem;text-align:center;line-height:1.7}
.fmodal-dl a{display:inline-flex;align-items:center;gap:6px;background:var(--cp);color:#fff;padding:8px 20px;border-radius:6px;text-decoration:none;font-size:.85rem;font-weight:600}

/* ── LIGHTBOX ── */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.lightbox.open{display:flex}
.lb-wrap{position:relative;display:flex;align-items:center;justify-content:center;max-width:90vw;max-height:82vh}
.lb-wrap img{max-width:90vw;max-height:82vh;object-fit:contain;border-radius:6px}
.lb-close{position:fixed;top:1rem;right:1rem;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-close:hover{background:rgba(255,255,255,.22)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-nav:hover{background:rgba(255,255,255,.22)}
.lb-prev{left:-58px}.lb-next{right:-58px}
.lb-cap{color:rgba(255,255,255,.75);font-size:.82rem;text-align:center}
.lb-cnt{color:rgba(255,255,255,.45);font-size:.74rem}

/* ══════════════════════════════════════════════
   MOBILE RESPONSIVE
══════════════════════════════════════════════ */
@media(max-width:768px){
  .toolbar{height:auto;padding:.5rem .8rem;flex-wrap:wrap;gap:6px}
  .tb-left{flex:1 1 100%;order:1}
  .tb-right{order:2;flex:1 1 100%;justify-content:flex-end}
  .tb-brand span{display:none} /* hide text, keep icon */
  .folder-chip span{max-width:80px}
  .btn-view{display:inline-flex!important}
  .workspace{flex-direction:column}
  .preview-pane{flex:none;height:0;overflow:hidden;transition:height .3s}
  .preview-pane.mobile-show{height:50vh;overflow-y:auto}
  .editor-pane{width:100%;flex:1}
  .lb-prev{left:-48px}.lb-next{right:-48px}
}
@media(max-width:480px){
  .lb-prev,.lb-next{display:none}
}
</style>
</head>
<body>

<header class="toolbar">
  <div class="tb-left">
    <div class="tb-brand"><i class="ti ti-browser"></i><span>학술대회 에디터</span></div>
    <div class="folder-chip" id="folder-chip" onclick="pickFolder()" title="이미지 저장 폴더 선택 (source/ 하위 폴더)">
      <i class="ti ti-folder"></i>
      <span id="folder-name">저장 폴더 선택</span>
    </div>
  </div>
  <div class="tb-right">
    <button class="btn btn-g btn-view" id="btn-view" onclick="toggleMobileView()"><i class="ti ti-eye"></i>미리보기</button>
    <button class="btn btn-g" onclick="resetData()"><i class="ti ti-refresh"></i>초기화</button>
    <button class="btn btn-p" onclick="exportHTML()"><i class="ti ti-download"></i>HTML 내보내기</button>
  </div>
</header>

<div class="workspace">
  <div class="preview-pane" id="preview-pane"><div id="preview"></div></div>
  <aside class="editor-pane">
    <div class="tab-strip">
      <button class="stab active" data-tab="basic"    onclick="switchTab('basic')">기본 정보</button>
      <button class="stab"        data-tab="greeting" onclick="switchTab('greeting')">축사</button>
      <button class="stab"        data-tab="keynote"  onclick="switchTab('keynote')">발제</button>
      <button class="stab"        data-tab="poster"   onclick="switchTab('poster')">포스터</button>
      <button class="stab"        data-tab="sketch"   onclick="switchTab('sketch')">현장 스케치</button>
    </div>
    <div class="form-scroll" id="form-area"></div>
  </aside>
</div>

<!-- File Viewer Modal -->
<div class="overlay" id="file-overlay" onclick="closeFileModal(event)">
  <div class="fmodal" onclick="event.stopPropagation()">
    <div class="fmodal-hd">
      <span class="fmodal-title" id="fmodal-title">자료 보기</span>
      <div style="display:flex;align-items:center;gap:8px">

/* 공백·특수문자 제거 — URL에서 안전하게 */
function sanitizeFileName(name){
  const dot = name.lastIndexOf('.');
  const ext  = dot >= 0 ? name.slice(dot).toLowerCase() : '';
  const base = dot >= 0 ? name.slice(0, dot) : name;
  const clean = base
    .trim()
    .replace(/\s+/g, '_')                   /* 공백 → _ */
    .replace(/[^a-zA-Z0-9_\-가-힣]/g, '_') /* 특수문자 → _ */
    .replace(/_+/g, '_')                    /* 연속 _ → 하나로 */
    .replace(/^_+|_+$/g, '')               /* 앞뒤 _ 제거 */
    || 'file';
  return clean + ext;
}

async function saveToSource(file){
  if(!dirHandle) return null;
  const safeName = sanitizeFileName(file.name);
  try{
    const src = await dirHandle.getDirectoryHandle('source',{create:true});
    const h = await src.getFileHandle(safeName,{create:true});
    const w = await h.createWritable();
    await w.write(file);
    await w.close();
    return 'source/' + safeName;
  }catch(e){
    console.warn('source/ 저장 실패:', e);
    return null;
  }
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function readFile(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function handleImgUpload(file){
  const base64 = await readFile(file);
  const pathRef = await saveToSource(file);
  return makeImg(base64, pathRef || base64);
}
function isPDF(name,data){
  return (data && data.startsWith('data:application/pdf')) || (name && /\.pdf$/i.test(name));
}
function isImageFile(name,data){
  return (data && /^data:image\//i.test(data)) || (name && /\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(name));
}
/* file-object type helpers */
function fileIsPDF(fo){
  if(!fo) return false;
  if(fo.type==='b64') return isPDF(fo.name, fo.data);
  if(fo.type==='url') return isPDF(fo.url, null);
  if(fo.type==='path') return isPDF(fo.path, null);
  return false;
}
function fileIsImg(fo){
  if(!fo) return false;
  if(fo.type==='b64') return isImageFile(fo.name, fo.data);
  if(fo.type==='url') return isImageFile(fo.url, null);
  if(fo.type==='path') return isImageFile(fo.path, null);
  return false;
}
function fileSrc(fo){
  if(!fo) return null;
  if(fo.type==='b64') return fo.data;
  if(fo.type==='url') return fo.url;
  if(fo.type==='path') return fo.path;
  return null;
}

/* ================================================================
   PDF.JS THUMBNAIL RENDERER
================================================================ */
let _pdfjsPromise = null;
function ensurePDFJS(){
  if(_pdfjsPromise) return _pdfjsPromise;
  _pdfjsPromise = new Promise(resolve=>{
    if(window.pdfjsLib){ resolve(true); return; }
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(true);
    };
    s.onerror=()=>{ _pdfjsPromise=null; resolve(false); };
    document.head.appendChild(s);
  });
  return _pdfjsPromise;
}
async function drawPDFPage(canvas, src){
  try{
    if(!await ensurePDFJS()) return;
    const pdf = await pdfjsLib.getDocument(src).promise;
    const page = await pdf.getPage(1);
    const vp0 = page.getViewport({scale:1});
    const container = canvas.closest('.p-item-prev,.p-pcard-prev');
    const w = (container ? container.clientWidth : canvas.clientWidth) || 400;
    const scale = w / vp0.width;
    const vp = page.getViewport({scale});
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
    const ph = canvas.parentElement?.querySelector('.p-thumb-ph');
    if(ph) ph.style.display='none';
  }catch(e){
    console.warn('PDF preview:', e);
    const ph = canvas.parentElement?.querySelector('.p-thumb-ph');
    if(ph){ ph.innerHTML='<span style="font-size:.72rem;color:#aaa">미리보기 불가</span>'; }
  }
}
async function renderPDFThumbs(){

    const k=D.keynotes.find(x=>x.id===+c.dataset.kid); if(!k) continue;
    const fo=getFilePreviewObj(k); if(!fileIsPDF(fo)) continue;
    await drawPDFPage(c, fileSrc(fo));
  }
  for(const c of document.querySelectorAll('#preview canvas[data-pid]')){
    const p=D.posters.find(x=>x.id===+c.dataset.pid); if(!p) continue;
    const fo=getFilePreviewObj(p); if(!fileIsPDF(fo)) continue;
    await drawPDFPage(c, fileSrc(fo));
  }
}

/* ================================================================
   FILE MODAL
================================================================ */
function openFile(fo, title){
  if(!fo) return;
  document.getElementById('fmodal-title').textContent = title || '자료 보기';
  const body = document.getElementById('fmodal-body');
  const dlBtn = document.getElementById('fmodal-dl');
  body.innerHTML = '';
  dlBtn.style.display = 'none';

  let src = '', pdf = false, fname = '';

  let img = false;
  if(fo.type === 'path'){
    /* NAS 호스팅 환경: 상대경로로 직접 로드 */
    src = fo.path;
    pdf = /\.pdf$/i.test(fo.path);
    img = isImageFile(fo.path, null);
    fname = fo.name || fo.path.split('/').pop();
  } else if(fo.type === 'url'){
    src = fo.url;
    pdf = isPDF(fo.url);
    img = isImageFile(fo.url, null);
    fname = fo.name || '파일';
  } else if(fo.type === 'b64'){
    const mime = fo.data.split(';')[0].split(':')[1];
    pdf = mime === 'application/pdf';
    img = /^image\//i.test(mime);
    const b = atob(fo.data.split(',')[1]), ab = new ArrayBuffer(b.length), ia = new Uint8Array(ab);
    for(let i=0;i<b.length;i++) ia[i] = b.charCodeAt(i);
    src = URL.createObjectURL(new Blob([ab],{type:mime}));
    fname = fo.name || '파일';
  }

  /* 다운로드 버튼 항상 표시 */
  dlBtn.href = src;
  dlBtn.download = fname;
  dlBtn.style.display = 'inline-flex';

  if(pdf){
    body.innerHTML = `<iframe src="${src}#toolbar=0&navpanes=0" title="${esc(title||'')}"></iframe>`;
  } else if(img){
    body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;padding:1rem;background:#000;min-height:200px;max-height:75vh;overflow:auto"><img src="${src}" alt="${esc(title||'')}" style="max-width:100%;max-height:73vh;object-fit:contain;border-radius:6px"></div>`;
  } else {
    body.innerHTML = `<div class="fmodal-dl">
      <i class="ti ti-file-text" style="font-size:3rem;color:#185FA5"></i>
      <p style="font-size:.88rem;color:#5f5e5a;text-align:center">
        이 파일 형식은 브라우저에서 직접 열 수 없습니다.<br>
        위 <strong>다운로드</strong> 버튼을 눌러 저장 후 여세요.
      </p>
    </div>`;
  }
  document.getElementById('file-overlay').classList.add('open');
}
function closeFileModal(e){
  if(e && e.target !== document.getElementById('file-overlay')) return;
  document.getElementById('file-overlay').classList.remove('open');
  document.getElementById('fmodal-body').innerHTML = '';
  document.getElementById('fmodal-dl').style.display = 'none';
}

/* ================================================================
   LIGHTBOX
================================================================ */
function openLightbox(i){ lbIdx=i; showLb(); document.getElementById('lightbox').classList.add('open'); }
function showLb(){
  const ph = D.sketch.photos[lbIdx]; if(!ph) return;
  document.getElementById('lb-img').src = imgSrc(ph);
  document.getElementById('lb-cap').textContent = ph.caption || '';
  document.getElementById('lb-cnt').textContent = `${lbIdx+1} / ${D.sketch.photos.length}`;
}
function lbNav(d){ lbIdx = (lbIdx+d+D.sketch.photos.length)%D.sketch.photos.length; showLb(); }
function closeLightbox(e){
  if(e && e.target !== document.getElementById('lightbox')) return;
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('lightbox').classList.contains('open')){
    if(e.key==='ArrowLeft') lbNav(-1);
    else if(e.key==='ArrowRight') lbNav(1);
    else if(e.key==='Escape') closeLightbox();
  }
  if(document.getElementById('file-overlay').classList.contains('open') && e.key==='Escape') closeFileModal();
});

/* ================================================================
   IMAGE WIDGET HTML BUILDER
================================================================ */
function imgWidget(opts){
  /* opts: { urlVal, urlAttr, fileAttr, imgObj, clearFn, hint } */
  const src = imgSrc(opts.imgObj);
  const ref = opts.imgObj ? (opts.imgObj.exportRef||opts.imgObj.src||'') : '';
  const isUrl = src && (src.startsWith('http') || src.startsWith('//'));
  const showPath = ref && ref.startsWith('source/');
  return`<div class="img-widget">
    <div class="img-widget-row">
      <input type="url" placeholder="이미지 URL (CDN 링크)" value="${isUrl?esc(src):''}" ${opts.urlAttr}>
      <span class="img-or">또는</span>
      <div class="file-pick" style="flex-shrink:0;min-width:90px">
        <input type="file" accept="image/*" ${opts.fileAttr}>
        <div class="file-pick-lbl"><i class="ti ti-upload"></i>파일</div>
      </div>
    </div>
    ${src?`<div class="img-preview">
      <img src="${src}" alt="">
      ${showPath?`<div style="font-size:.68rem;color:#5dbf78;margin-top:2px"><i class="ti ti-folder"></i> ${esc(ref)}</div>`:''}
      <button class="img-preview-del" onclick="${opts.clearFn}" title="이미지 제거">✕</button>
    </div>`:''}
    ${folderHint()}
  </div>`;
}

}

/* ================================================================
   BIND LISTENERS
================================================================ */
function bindListeners(){
  const a = document.getElementById('form-area');

  /* Basic text fields */
  a.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input',()=>{ D.basic[el.dataset.f]=el.value; save(); renderPreview(); });
  });

  /* Hero URL */
  const heroUrl = a.querySelector('#hero-url');
  if(heroUrl) heroUrl.addEventListener('change',()=>{
    const v = heroUrl.value.trim();
    D.basic.heroImage = v ? makeImg(v,v) : null;
    save(); renderPreview(); renderPanel();
  });

  /* Hero file */
  const heroFile = a.querySelector('#hero-file');
  if(heroFile) heroFile.addEventListener('change',async e=>{
    const f = e.target.files[0]; if(!f) return;
    D.basic.heroImage = await handleImgUpload(f);
    save(); renderPreview(); renderPanel();
  });

  /* Greeting text */
  a.querySelectorAll('[data-gf]').forEach(el=>{
    el.addEventListener('input',()=>{
      const g = D.greetings.find(x=>x.id==el.dataset.gid);
      if(g){ g[el.dataset.gf]=el.value; save(); renderPreview(); }
    });
  });

  /* Greeting photo URL */
  a.querySelectorAll('.gphoto-url').forEach(el=>{
    el.addEventListener('change',()=>{
      const g = D.greetings.find(x=>x.id==el.dataset.gid);
      const v = el.value.trim();
      if(g){ g.photo = v ? makeImg(v,v) : null; save(); renderPreview(); renderPanel(); }
    });
  });

  /* Greeting photo file */
  a.querySelectorAll('.gphoto-file').forEach(el=>{
    el.addEventListener('change',async e=>{
      const f = e.target.files[0]; if(!f) return;
      const g = D.greetings.find(x=>x.id==+el.dataset.gid);
      if(g){ g.photo = await handleImgUpload(f); save(); renderPreview(); renderPanel(); }
    });
  });

  /* Keynote text */
  a.querySelectorAll('[data-kf]').forEach(el=>{
    el.addEventListener('input',()=>{
      const k = D.keynotes.find(x=>x.id==el.dataset.kid);
      if(k){ k[el.dataset.kf]=el.value; save(); renderPreview(); }
    });
  });

  /* Keynote file */
  a.querySelectorAll('.kfile').forEach(el=>{
    el.addEventListener('change',async e=>{
      const f = e.target.files[0]; if(!f) return;
      const kid = +el.dataset.kid;
      if(!dirHandle) await requireFolder(e);
      if(!f) return; /* cancelled */
      const base64 = await readFile(f);
      const pathRef = await saveToSource(f);
      const safeName = sanitizeFileName(f.name);
      const k = D.keynotes.find(x=>x.id===kid);
      if(k){ k.fileData=base64; k.fileName=safeName; k.fileUrl=''; k.filePath=pathRef||''; save(); renderPreview(); renderPanel(); }
    });
  });

  /* Poster text */
  a.querySelectorAll('[data-pf]').forEach(el=>{
    el.addEventListener('input',()=>{
      const p = D.posters.find(x=>x.id==el.dataset.pid);
      if(p){ p[el.dataset.pf]=el.value; save(); renderPreview(); }
    });
  });

  /* Poster file */
  a.querySelectorAll('.pfile').forEach(el=>{
    el.addEventListener('change',async e=>{
      const f = e.target.files[0]; if(!f) return;
      const pid = +el.dataset.pid;
      if(!dirHandle) await requireFolder(e);
      if(!f) return;
      const base64 = await readFile(f);
      const pathRef = await saveToSource(f);
      const safeName = sanitizeFileName(f.name);
      const p = D.posters.find(x=>x.id===pid);
      if(p){ p.fileData=base64; p.fileName=safeName; p.fileUrl=''; p.filePath=pathRef||''; save(); renderPreview(); renderPanel(); }
    });
  });

  /* Sketch files */
  const sf = a.querySelector('#sketch-files');
  if(sf) sf.addEventListener('change',async e=>{
    const files = Array.from(e.target.files);
    for(const f of files){
      const img = await handleImgUpload(f);
      D.sketch.photos.push({ ...img, caption:'' });
    }
    save(); renderPreview(); renderPanel();
  });

  /* Sketch URL enter key */
  const sui = a.querySelector('#sketch-url-input');
  if(sui) sui.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addSketchUrl(); } });

  /* Photo captions */
  a.querySelectorAll('[data-pi]').forEach(el=>{
    el.addEventListener('input',()=>{
      const i = +el.dataset.pi;
      if(D.sketch.photos[i]) D.sketch.photos[i].caption = el.value;
      save(); renderPreview();
    });
  });
}

/* ================================================================
   CRUD
================================================================ */
function removeItem(arr,id){ D[arr]=D[arr].filter(x=>x.id!==id); save(); renderPreview(); renderPanel(); }
function moveItem(arr,id,dir){
  const i=D[arr].findIndex(x=>x.id===id); if(i<0)return;
  const j=i+dir; if(j<0||j>=D[arr].length)return;
  [D[arr][i],D[arr][j]]=[D[arr][j],D[arr][i]];
  save(); renderPreview(); renderPanel();
}
function setAward(id,award){
  const p=D.posters.find(x=>x.id===id); if(p){p.award=award;save();renderPreview();renderPanel();}
}
function sortByAward(){
  const order={'최우수':0,'우수':1,'장려':2,'':3};
  D.posters.sort((a,b)=>(order[a.award??'']??3)-(order[b.award??'']??3));
  save(); renderPreview(); renderPanel();
}
function addGreeting(){
  D.greetings.push({id:++uid,body:'',initial:'',name:'',org:'',role:'',photo:null});
  save(); renderPreview(); renderPanel();
}
function clearGPhoto(id){
  const g=D.greetings.find(x=>x.id===id); if(g){g.photo=null;save();renderPreview();renderPanel();}
}
function addKeynote(){
  D.keynotes.push({id:++uid,title:'',presenter:'',time:'',fileUrl:'',filePath:'',fileData:null,fileName:''});
  save(); renderPreview(); renderPanel();
}
function clearKFile(id){
  const k=D.keynotes.find(x=>x.id===id); if(k){k.fileData=null;k.fileName='';k.fileUrl='';k.filePath='';save();renderPreview();renderPanel();}
}
function addPoster(){
  const n='P-'+String(D.posters.length+1).padStart(2,'0');
  D.posters.push({id:++uid,num:n,title:'',author:'',fileUrl:'',filePath:'',fileData:null,fileName:'',award:''});
  save(); renderPreview(); renderPanel();
}
function clearPFile(id){
  const p=D.posters.find(x=>x.id===id); if(p){p.fileData=null;p.fileName='';p.fileUrl='';p.filePath='';save();renderPreview();renderPanel();}
}
function removePhoto(i){ D.sketch.photos.splice(i,1); save(); renderPreview(); renderPanel(); }
function addSketchUrl(){
  const inp = document.getElementById('sketch-url-input');
  if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  D.sketch.photos.push({ src:v, exportRef:v, caption:'' });
  save(); renderPreview(); renderPanel();
}

================================================================ */
function exportHTML(){
  /* base64 파일이 있으면 경고 */
  const b64items = [
    ...D.keynotes.filter(k=>!k.filePath&&!k.fileUrl&&k.fileData).map(k=>`발제: ${k.title||k.fileName}`),
    ...D.posters.filter(p=>!p.filePath&&!p.fileUrl&&p.fileData).map(p=>`포스터: ${p.title||p.fileName}`)
  ];
  if(b64items.length){
    const ok = confirm(
      `⚠ 아래 파일이 source/ 경로 없이 HTML에 직접 포함됩니다.\n용량이 50MB 이상으로 커질 수 있습니다.\n\n${b64items.join('\n')}\n\n👉 해결: 툴바의 [저장 폴더 선택]으로 폴더를 지정하고 파일을 다시 업로드하세요.\n\n그래도 내보내시겠습니까?`
    );
    if(!ok) return;
  }
  const b = D.basic;
  const heroRef = imgExportRef(b.heroImage);
  const heroImg = heroRef
    ? `<img src="${heroRef}" alt="대표 이미지" style="width:100%;height:auto;border-radius:12px;border:1px solid #e0ded6;display:block">`
    : `<div style="width:100%;height:160px;background:linear-gradient(135deg,#E6F1FB,#B5D4F4);border-radius:12px;border:1px dashed #B5D4F4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#185FA5;gap:6px;font-size:.82rem;opacity:.7">대표 이미지 삽입 영역</div>`;

  const greetingsHtml = D.greetings.map(g=>{
    const ref = imgExportRef(g.photo);
    const av = ref
      ? `<div style="width:88px;height:88px;border-radius:50%;overflow:hidden;margin-bottom:.8rem;border:1px solid #e0ded6;flex-shrink:0"><img src="${ref}" alt="${esc(g.name)}" style="width:100%;height:100%;object-fit:cover"></div>`
      : `<div style="width:88px;height:88px;border-radius:50%;background:#E6F1FB;border:1px solid #B5D4F4;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:#185FA5;margin-bottom:.8rem;flex-shrink:0">${esc(g.initial)}</div>`;
    return`<div class="greeting-card">
      <div class="gbody">${esc(g.body)}</div>
      <div class="ginfo">${av}
        <div class="gname">${esc(g.name)}</div>
        <div class="gorg">${esc(g.org)}<br>${esc(g.role)}</div>
      </div></div>`;
  }).join('');

  /* canvas 썸네일용 src: path/URL만 허용 — base64는 반환 안 함 (onclick에 이미 있어 중복 방지) */
  function expPrevSrc(item){
    if(item.filePath) return item.filePath;
    if(item.fileUrl)  return item.fileUrl;
    return null;
  }

  const keynotesHtml = D.keynotes.map(k=>{
    const fo = getFileObj(k);
    const hasPDF = fileIsPDF(fo);
    const hasImg = !hasPDF && fileIsImg(fo);
    const hasPrev = hasPDF || hasImg;
    const prevSrc = hasPrev ? expPrevSrc(k) : null;
    let prevEl = '';
    if(hasPDF && prevSrc){
      prevEl=`<div class="item-prev"><canvas data-pdfsrc="${esc(prevSrc)}" style="width:100%;display:block"></canvas><div class="thumb-ph">미리보기 로딩 중...</div></div>`;
    } else if(hasImg && prevSrc){
      prevEl=`<div class="item-prev" style="background:#111"><img src="${esc(prevSrc)}" alt="${esc(k.title)}" style="width:100%;height:100%;object-fit:contain;display:block"></div>`;
    }
    const click = fo ? `onclick="openFile(${JSON.stringify(JSON.stringify(fo)).slice(1,-1).replace(/'/g,"\\'")},'${esc(k.title).replace(/'/g,"\\'")}')"` : '';
    const badge = fo ? `<span class="fbadge">&#128196; 자료 보기</span>` : '';
    if(hasPrev){
      return`<div class="item${fo?' clickable':''} has-prev" ${click}>

    return`<div class="item${fo?' clickable':''}" ${click} ${hover}>
      <div><div class="ititle">${esc(k.title)}</div><div class="iauth">${esc(k.presenter)}</div></div>
      <div class="iright"><span class="itime">${esc(k.time)}</span>${badge}</div>
    </div>`;
  }).join('');

  const postersHtml = D.posters.map(p=>{
    const fo = getFileObj(p);
    const hasPDF = fileIsPDF(fo);
    const hasImg = !hasPDF && fileIsImg(fo);
    const hasPrev = hasPDF || hasImg;

.ptitle{font-size:.86rem;font-weight:500;line-height:1.5;margin-bottom:8px}
.pauth{font-size:.78rem;color:#5f5e5a}
.sk-ph{text-align:center;padding:3.5rem 2rem;background:#fff;border:1px dashed #e0ded6;border-radius:12px;color:#5f5e5a}
.sk-icon{font-size:2.5rem;opacity:.25;margin-bottom:.8rem}
.sk-sub{font-size:.78rem;opacity:.6;margin-top:.3rem}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.photo-item{border-radius:8px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:#f1efe8;position:relative}
.photo-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s;display:block}
.photo-item:hover img{transform:scale(1.04)}
.photo-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);color:#fff;font-size:.75rem;padding:1rem .6rem .5rem;opacity:0;transition:opacity .2s}
.photo-item:hover .photo-cap{opacity:1}
footer{background:#fff;border-top:1px solid #e0ded6;padding:2rem;text-align:center;font-size:.83rem;color:#5f5e5a}
footer a{color:#185FA5;text-decoration:none}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.fmodal{background:#fff;border-radius:12px;overflow:hidden;width:min(900px,92vw);max-height:90vh;display:flex;flex-direction:column}
.fmodal-hd{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;border-bottom:1px solid #e0ded6;flex-shrink:0}
.fmodal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#5f5e5a;display:flex;align-items:center;padding:4px;border-radius:4px}
.fmodal-body{flex:1;overflow:hidden}
.fmodal-body iframe{width:100%;height:70vh;border:none;display:block}
.fmodal-dl{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;gap:1rem;min-height:250px;color:#5f5e5a}
.fmodal-dl a{display:inline-flex;align-items:center;gap:6px;background:#185FA5;color:#fff;padding:8px 20px;border-radius:6px;text-decoration:none;font-size:.85rem;font-weight:600}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.lb.open{display:flex}
.lb-wrap{position:relative;display:flex;align-items:center;justify-content:center;max-width:90vw;max-height:82vh}
.lb-wrap img{max-width:90vw;max-height:82vh;object-fit:contain;border-radius:6px}
.lb-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-close-pos{position:fixed;top:1rem;right:1rem}
.lb-prev{position:absolute;top:50%;transform:translateY(-50%);left:-56px}
.lb-next{position:absolute;top:50%;transform:translateY(-50%);right:-56px}
.lb-cap{color:rgba(255,255,255,.75);font-size:.82rem;text-align:center}
.lb-cnt{color:rgba(255,255,255,.45);font-size:.74rem}
/* ── Mobile ── */
@media(max-width:600px){
  .greeting-card{grid-template-columns:1fr}
  .ginfo{flex-direction:row;text-align:left;gap:1rem;align-items:flex-start}
  .hero-meta{flex-direction:column;align-items:center;gap:.6rem}
  .con{padding:2rem 1.2rem}
  nav{padding:0 1.2rem}
  .div{margin:0 1.2rem}
  .hero{padding:2.5rem 1.2rem 2rem}
  .lb-prev,.lb-next{display:none}
}
</style>

<div class="overlay" id="fov" onclick="if(event.target===this)closeFM()">
  <div class="fmodal" onclick="event.stopPropagation()">
    <div class="fmodal-hd">
      <span id="fm-title" style="font-size:.88rem;font-weight:600">자료 보기</span>

        <a id="fm-dl" href="#" download style="display:none;align-items:center;gap:4px;background:#185FA5;color:#fff;padding:5px 12px;border-radius:6px;text-decoration:none;font-size:.78rem;font-weight:600">⬇ 다운로드</a>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="if(event.target===this)closeLB()">

  <div class="lb-wrap" onclick="event.stopPropagation()">
    <button class="lb-btn lb-prev" onclick="lbNav(-1)">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-btn lb-next" onclick="lbNav(1)">&#8250;</button>
  </div>
  <div class="lb-cap" id="lb-cap"></div>
  <div class="lb-cnt" id="lb-cnt"></div>
</div>

<script>
const PHOTOS=${photosJSON};
let lbI=0;
function openFile(foStr,title){
  let fo;try{fo=JSON.parse(foStr);}catch(e){return;}if(!fo)return;
  document.getElementById('fm-title').textContent=title||'자료 보기';
  const body=document.getElementById('fm-body');
  const dlBtn=document.getElementById('fm-dl');
  body.innerHTML='';dlBtn.style.display='none';
  let src='',pdf=false,img=false,fname='';
  if(fo.type==='path'){
    src=fo.path;pdf=/\\.pdf$/i.test(fo.path);img=/\\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(fo.path);fname=fo.name||fo.path.split('/').pop();
  }else if(fo.type==='url'){
    src=fo.url;pdf=/\\.pdf$/i.test(fo.url);img=/\\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(fo.url);fname=fo.name||'파일';
  }else if(fo.type==='b64'){
    const mime=fo.data.split(';')[0].split(':')[1];pdf=mime==='application/pdf';img=/^image\\//i.test(mime);
    const b=atob(fo.data.split(',')[1]),ab=new ArrayBuffer(b.length),ia=new Uint8Array(ab);
    for(let i=0;i<b.length;i++)ia[i]=b.charCodeAt(i);
    src=URL.createObjectURL(new Blob([ab],{type:mime}));fname=fo.name||'파일';
  }
  dlBtn.href=src;dlBtn.download=fname;dlBtn.style.display='inline-flex';
  if(pdf){
    body.innerHTML='<iframe src="'+src+'#toolbar=0&navpanes=0" style="width:100%;height:70vh;border:none;display:block"></iframe>';
  }else if(img){
    body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;padding:1rem;background:#000;min-height:200px;max-height:75vh;overflow:auto"><img src="'+src+'" alt="" style="max-width:100%;max-height:73vh;object-fit:contain;border-radius:6px"></div>';
  }else{
    body.innerHTML='<div class="fmodal-dl"><p style="font-size:.9rem;color:#5f5e5a;text-align:center">이 파일 형식은 브라우저에서 직접 열 수 없습니다.<br>위 <strong>다운로드</strong> 버튼을 눌러 저장 후 여세요.</p></div>';
  }
  document.getElementById('fov').classList.add('open');
}
function closeFM(){
  document.getElementById('fov').classList.remove('open');
  document.getElementById('fm-body').innerHTML='';
  document.getElementById('fm-dl').style.display='none';
}
function openLightbox(i){lbI=i;showLB();document.getElementById('lb').classList.add('open');}
function showLB(){const ph=PHOTOS[lbI];if(!ph)return;document.getElementById('lb-img').src=ph.src;document.getElementById('lb-cap').textContent=ph.caption||'';document.getElementById('lb-cnt').textContent=(lbI+1)+' / '+PHOTOS.length;}
function lbNav(d){lbI=(lbI+d+PHOTOS.length)%PHOTOS.length;showLB();}
function closeLB(){document.getElementById('lb').classList.remove('open');}
document.addEventListener('keydown',e=>{
  if(document.getElementById('lb').classList.contains('open')){if(e.key==='ArrowLeft')lbNav(-1);else if(e.key==='ArrowRight')lbNav(1);else if(e.key==='Escape')closeLB();}
  if(document.getElementById('fov').classList.contains('open')&&e.key==='Escape')closeFM();
});
const navLinks=document.querySelectorAll('.nav-inner a');
const secs=document.querySelectorAll('section[id]');
const obs=new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting){navLinks.forEach(l=>l.classList.remove('active'));const a=document.querySelector('.nav-inner a[href="#'+en.target.id+'"]');if(a)a.classList.add('active');}});},{rootMargin:'-40% 0px -50% 0px'});
secs.forEach(s=>obs.observe(s));
navLinks.forEach(l=>l.addEventListener('click',e=>{e.preventDefault();const t=document.querySelector(l.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth'});}));
/* PDF Thumbnails */
(function(){
  const canvases=document.querySelectorAll('canvas[data-pdfsrc]');
  if(!canvases.length) return;
  async function drawAll(){
    for(const canvas of canvases){
      try{
        const src=canvas.dataset.pdfsrc;
        const pdf=await pdfjsLib.getDocument(src).promise;
        const page=await pdf.getPage(1);
        const vp0=page.getViewport({scale:1});
        const container=canvas.closest('.item-prev,.pcard-prev');
        const w=(container?container.clientWidth:canvas.clientWidth)||400;
        const scale=w/vp0.width;
        const vp=page.getViewport({scale});
        canvas.width=vp.width;canvas.height=vp.height;
        await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
        const ph=canvas.parentElement?.querySelector('.thumb-ph');
        if(ph)ph.style.display='none';
      }catch(e){
        const ph=canvas.parentElement?.querySelector('.thumb-ph');
        if(ph)ph.textContent='미리보기 불가';
      }
    }
  }
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=function(){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';drawAll();};
  document.head.appendChild(s);
})();
<\/script>

  URL.revokeObjectURL(url);
}

);

</script>
