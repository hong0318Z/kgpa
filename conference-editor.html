<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학술대회 페이지 에디터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --cp:#185FA5;--cp-bg:#E6F1FB;--cp-lt:#B5D4F4;
  --cs:#3B6D11;--cs-bg:#EAF3DE;
  --ct:#1a1a1a;--cts:#5f5e5a;--cth:#888780;
  --cbg:#f5f5f3;--cw:#ffffff;--cbs:#f1efe8;
  --cb:#e0ded6;--cbs2:#c8c6be;
  --rsm:6px;--rmd:8px;--rlg:12px;
  --ed:#161622;--ep:#1e1e2e;--es:#252538;
  --eb:#32324a;--et:#ddddf0;--ets:#8888b0;
  --ea:#7c6af7;--eah:#6a58e0;--eab:#2e2850;
  --ei:#12121e;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Noto Sans KR',sans-serif;background:var(--ed);color:var(--et);display:flex;flex-direction:column}

/* TOOLBAR */
.toolbar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:var(--ep);border-bottom:1px solid var(--eb);flex-shrink:0}
.tb-brand{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--ea)}
.tb-brand i{font-size:1.1rem}
.tb-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:6px;font-size:.8rem;font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn-p{background:var(--ea);color:#fff}.btn-p:hover{background:var(--eah)}
.btn-g{background:transparent;color:var(--ets);border:1px solid var(--eb)}.btn-g:hover{border-color:var(--ea);color:var(--ea)}

/* WORKSPACE */
.workspace{flex:1;display:flex;overflow:hidden}
.preview-pane{flex:1;overflow-y:auto;background:var(--cbg);scrollbar-width:thin}
.editor-pane{width:400px;flex-shrink:0;display:flex;flex-direction:column;background:var(--ep);border-left:1px solid var(--eb)}

/* TABS */
.tab-strip{display:flex;overflow-x:auto;border-bottom:1px solid var(--eb);flex-shrink:0}
.tab-strip::-webkit-scrollbar{height:2px}.tab-strip::-webkit-scrollbar-thumb{background:var(--ea)}
.stab{flex-shrink:0;padding:10px 12px;font-size:.76rem;font-family:inherit;color:var(--ets);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.stab:hover{color:var(--et)}.stab.active{color:var(--ea);border-bottom-color:var(--ea)}
.form-scroll{flex:1;overflow-y:auto;padding:1rem;scrollbar-width:thin}

/* FORM ELEMENTS */
.fg{margin-bottom:.85rem}
.fg label{display:block;font-size:.72rem;font-weight:600;color:var(--ets);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fg input[type=text],.fg input[type=email],.fg input[type=url],.fg textarea,.fg select{width:100%;background:var(--ei);border:1px solid var(--eb);border-radius:6px;color:var(--et);font-family:inherit;font-size:.82rem;padding:7px 10px;outline:none;transition:border-color .15s}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--ea)}
.fg textarea{resize:vertical;min-height:75px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ITEM CARDS */
.icard{background:var(--es);border:1px solid var(--eb);border-radius:8px;padding:.75rem;margin-bottom:.6rem}
.icard-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.icard-num{font-size:.72rem;font-weight:700;color:var(--ea);text-transform:uppercase}
.icard-actions{display:flex;gap:3px}
.ibtn{background:transparent;border:none;color:var(--ets);cursor:pointer;padding:3px 5px;border-radius:4px;font-size:.78rem;display:flex;align-items:center;transition:all .15s}
.ibtn:hover{background:var(--eb);color:var(--et)}.ibtn.del:hover{background:#3d1515;color:#e05050}
.add-btn{width:100%;padding:8px;background:transparent;border:1px dashed var(--eb);border-radius:6px;color:var(--ets);font-family:inherit;font-size:.78rem;cursor:pointer;transition:all .15s;margin-top:.4rem}
.add-btn:hover{border-color:var(--ea);color:var(--ea)}

/* FILE PICK */
.file-pick{position:relative;border:1px dashed var(--eb);border-radius:6px;padding:8px 10px;text-align:center;cursor:pointer;transition:border-color .15s;overflow:hidden}
.file-pick:hover{border-color:var(--ea)}
.file-pick input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;width:100%;height:100%}
.file-pick-label{font-size:.75rem;color:var(--ets);pointer-events:none}
.ftag{display:inline-flex;align-items:center;gap:4px;background:var(--eab);color:var(--ea);padding:2px 8px;border-radius:4px;font-size:.7rem;margin-top:3px}
.sep{height:1px;background:var(--eb);margin:.8rem 0}
.sub-hd{font-size:.7rem;font-weight:700;color:var(--ets);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem}

/* PHOTO GRID EDITOR */
.pgrid-ed{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.pthumb{aspect-ratio:1;border-radius:4px;overflow:hidden;position:relative;background:var(--ei)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);border:none;border-radius:3px;color:#fff;font-size:9px;padding:1px 4px;cursor:pointer;opacity:0;transition:opacity .15s}
.pthumb:hover .pthumb-del{opacity:1}

/* ============ CONFERENCE PAGE STYLES (scoped to #preview) ============ */
#preview{font-family:'Noto Sans KR',sans-serif;font-size:16px;line-height:1.7;color:var(--ct);background:var(--cbg)}

#preview .p-nav{background:var(--cw);border-bottom:1px solid var(--cb);position:sticky;top:0;z-index:50;padding:0 2rem}
#preview .p-nav-inner{max-width:920px;margin:0 auto;display:flex;overflow-x:auto}
#preview .p-nav-inner a{padding:.9rem 1.1rem;font-size:.86rem;color:var(--cts);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
#preview .p-nav-inner a:hover,#preview .p-nav-inner a.active{color:var(--ct);border-bottom-color:var(--cp)}

#preview .p-con{max-width:920px;margin:0 auto;padding:3rem 2rem}
#preview .p-div{height:1px;background:var(--cb);margin:0 2rem}
#preview .p-slabel{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--cp);text-transform:uppercase;margin-bottom:4px}
#preview .p-stitle{font-size:1.5rem;font-weight:500;margin-bottom:1.8rem}

/* Hero */
#preview .p-hero{background:var(--cw);border-bottom:1px solid var(--cb);padding:4rem 2rem 3rem;text-align:center}
#preview .p-badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--cp);background:var(--cp-bg);padding:5px 16px;border-radius:20px;margin-bottom:1.2rem}
#preview .p-hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.3;margin-bottom:.6rem}
#preview .p-hero-sub{font-size:1rem;color:var(--cts);margin-bottom:2rem}
#preview .p-hero-meta{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;margin-bottom:2rem}
#preview .p-hero-meta span{font-size:.88rem;color:var(--cts);display:flex;align-items:center;gap:5px}
#preview .p-hero-img{max-width:860px;margin:0 auto}
#preview .p-hero-img img{width:100%;height:260px;object-fit:cover;border-radius:var(--rlg);border:1px solid var(--cb);display:block}
#preview .p-hero-ph{width:100%;height:180px;background:linear-gradient(135deg,var(--cp-bg),var(--cp-lt));border-radius:var(--rlg);border:1px dashed var(--cp-lt);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cp);gap:6px;font-size:.82rem;opacity:.7}

/* Greeting */
#preview .p-greeting{background:var(--cw);border:1px solid var(--cb);border-radius:var(--rlg);padding:2rem;display:grid;grid-template-columns:1fr 160px;gap:2rem;margin-bottom:1.2rem}
#preview .p-greeting:last-child{margin-bottom:0}
#preview .p-gbody{font-family:'Noto Serif KR',serif;font-size:.92rem;color:var(--cts);line-height:2}
#preview .p-ginfo{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:.5rem}
#preview .p-avatar{width:88px;height:88px;border-radius:50%;background:var(--cp-bg);border:1px solid var(--cp-lt);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--cp);margin-bottom:.8rem;overflow:hidden}
#preview .p-avatar img{width:100%;height:100%;object-fit:cover}
#preview .p-gname{font-size:.92rem;font-weight:700;margin-bottom:4px}
#preview .p-gorg{font-size:.78rem;color:var(--cts);line-height:1.5}

/* Paper/Keynote item */
#preview .p-item{background:var(--cw);border:1px solid var(--cb);border-radius:var(--rmd);padding:1rem 1.25rem;margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;transition:border-color .2s}
#preview .p-item:last-child{margin-bottom:0}
#preview .p-item:hover{border-color:var(--cbs2)}
#preview .p-item.clickable{cursor:pointer}
#preview .p-item.clickable:hover{border-color:var(--cp);background:var(--cp-bg)}
#preview .p-ititle{font-size:.94rem;font-weight:500;margin-bottom:4px}
#preview .p-iauthors{font-size:.8rem;color:var(--cts)}
#preview .p-iright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
#preview .p-itime{font-size:.8rem;color:var(--cth);white-space:nowrap}
#preview .p-fbadge{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--cp);background:var(--cp-bg);padding:2px 7px;border-radius:4px}

/* Poster */
#preview .p-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
#preview .p-pcard{background:var(--cw);border:1px solid var(--cb);border-radius:var(--rmd);padding:1rem 1.1rem;transition:all .2s}
#preview .p-pcard.clickable{cursor:pointer}
#preview .p-pcard.clickable:hover{border-color:var(--cp);background:var(--cp-bg)}
#preview .p-pnum{font-size:11px;font-weight:700;color:var(--cs);margin-bottom:6px;letter-spacing:.05em}
#preview .p-ptitle{font-size:.86rem;font-weight:500;line-height:1.5;margin-bottom:8px}
#preview .p-pauthor{font-size:.78rem;color:var(--cts)}

/* Field Sketch */
#preview .p-sk-ph{text-align:center;padding:3.5rem 2rem;background:var(--cw);border:1px dashed var(--cb);border-radius:var(--rlg);color:var(--cts)}
#preview .p-sk-ph i{font-size:2.5rem;opacity:.25;display:block;margin-bottom:.8rem}
#preview .p-sk-ph p{font-size:.9rem}
#preview .p-sk-ph small{font-size:.78rem;opacity:.6}
#preview .p-photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
#preview .p-photo-item{border-radius:var(--rmd);overflow:hidden;aspect-ratio:4/3;cursor:pointer;background:var(--cbs);position:relative}
#preview .p-photo-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
#preview .p-photo-item:hover img{transform:scale(1.04)}
#preview .p-photo-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);color:#fff;font-size:.75rem;padding:1rem .6rem .5rem;opacity:0;transition:opacity .2s}
#preview .p-photo-item:hover .p-photo-cap{opacity:1}

/* Footer */
#preview .p-footer{background:var(--cw);border-top:1px solid var(--cb);padding:2rem;text-align:center;font-size:.83rem;color:var(--cts)}
#preview .p-footer a{color:var(--cp);text-decoration:none}

/* ============ MODALS ============ */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.fmodal{background:#fff;border-radius:12px;overflow:hidden;width:min(900px,92vw);max-height:90vh;display:flex;flex-direction:column}
.fmodal-hd{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.2rem;border-bottom:1px solid var(--cb);flex-shrink:0}
.fmodal-title{font-size:.88rem;font-weight:600;color:var(--ct)}
.fmodal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--cts);display:flex;align-items:center;padding:4px;border-radius:4px}
.fmodal-close:hover{background:var(--cbs)}
.fmodal-body{flex:1;overflow:hidden;min-height:200px}
.fmodal-body iframe{width:100%;height:70vh;border:none;display:block}
.fmodal-dl{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;gap:1rem;min-height:250px;color:var(--cts)}
.fmodal-dl i{font-size:3rem;color:var(--cp)}
.fmodal-dl p{font-size:.88rem;text-align:center;line-height:1.7}
.fmodal-dl a{display:inline-flex;align-items:center;gap:6px;background:var(--cp);color:#fff;padding:8px 20px;border-radius:6px;text-decoration:none;font-size:.85rem;font-weight:600}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.lightbox.open{display:flex}
.lb-wrap{position:relative;display:flex;align-items:center;justify-content:center;max-width:90vw;max-height:82vh}
.lb-wrap img{max-width:90vw;max-height:82vh;object-fit:contain;border-radius:6px}
.lb-close{position:fixed;top:1rem;right:1rem;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-close:hover{background:rgba(255,255,255,.22)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-nav:hover{background:rgba(255,255,255,.22)}
.lb-prev{left:-60px}.lb-next{right:-60px}
.lb-cap{color:rgba(255,255,255,.75);font-size:.82rem;text-align:center}
.lb-cnt{color:rgba(255,255,255,.45);font-size:.74rem}
</style>
</head>
<body>

<header class="toolbar">
  <div class="tb-brand"><i class="ti ti-browser"></i>학술대회 페이지 에디터</div>
  <div class="tb-actions">
    <button class="btn btn-g" onclick="resetData()"><i class="ti ti-refresh"></i>초기화</button>
    <button class="btn btn-p" onclick="exportHTML()"><i class="ti ti-download"></i>HTML 내보내기</button>
  </div>
</header>

<div class="workspace">
  <div class="preview-pane"><div id="preview"></div></div>
  <aside class="editor-pane">
    <div class="tab-strip">
      <button class="stab active" data-tab="basic" onclick="switchTab('basic')">기본 정보</button>
      <button class="stab" data-tab="greeting" onclick="switchTab('greeting')">축사</button>
      <button class="stab" data-tab="keynote" onclick="switchTab('keynote')">특강</button>
      <button class="stab" data-tab="poster" onclick="switchTab('poster')">포스터</button>
      <button class="stab" data-tab="sketch" onclick="switchTab('sketch')">현장 스케치</button>
    </div>
    <div class="form-scroll" id="form-area"></div>
  </aside>
</div>

<!-- File Viewer Modal -->
<div class="overlay" id="file-overlay" onclick="closeFileModal(event)">
  <div class="fmodal" onclick="event.stopPropagation()">
    <div class="fmodal-hd">
      <span class="fmodal-title" id="fmodal-title">자료 보기</span>
      <button class="fmodal-close" onclick="closeFileModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="fmodal-body" id="fmodal-body"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-close" onclick="closeLightbox()"><i class="ti ti-x"></i></button>
  <div class="lb-wrap" onclick="event.stopPropagation()">
    <button class="lb-nav lb-prev" onclick="lbNav(-1)"><i class="ti ti-chevron-left"></i></button>
    <img id="lb-img" src="" alt="">
    <button class="lb-nav lb-next" onclick="lbNav(1)"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="lb-cap" id="lb-cap"></div>
  <div class="lb-cnt" id="lb-cnt"></div>
</div>

<script>

   DATA

/* ================================================================
   UTILITY
================================================================ */
function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
function isPDF(name,data){
  if(data && data.startsWith('data:application/pdf')) return true;
  if(name && /\.pdf$/i.test(name)) return true;
  return false;
}
function getFileObj(item){
  if(item.fileData) return{type:'b64',data:item.fileData,name:item.fileName};
  if(item.fileUrl)  return{type:'url',url:item.fileUrl,name:item.fileUrl.split('/').pop()};
  return null;
}

/* ================================================================
   FILE MODAL
================================================================ */
function openFile(fo,title){
  if(!fo)return;
  document.getElementById('fmodal-title').textContent=title||'자료 보기';
  const body=document.getElementById('fmodal-body');
  body.innerHTML='';
  let src='',pdf=false,fname='';
  if(fo.type==='url'){
    src=fo.url; pdf=isPDF(fo.url); fname=fo.name||'파일';
  }else if(fo.type==='b64'){
    const mime=fo.data.split(';')[0].split(':')[1];
    pdf=mime==='application/pdf';
    const b=atob(fo.data.split(',')[1]),ab=new ArrayBuffer(b.length),ia=new Uint8Array(ab);
    for(let i=0;i<b.length;i++)ia[i]=b.charCodeAt(i);
    src=URL.createObjectURL(new Blob([ab],{type:mime}));
    fname=fo.name||'파일';
  }
  if(pdf){
    body.innerHTML=`<iframe src="${src}#toolbar=1"></iframe>`;
  }else{
    body.innerHTML=`<div class="fmodal-dl">
      <i class="ti ti-file-presentation"></i>
      <p>이 파일 형식은 브라우저에서 바로 볼 수 없습니다.<br>아래 버튼을 클릭하여 다운로드하세요.</p>
      <a href="${src}" download="${esc(fname)}" target="_blank"><i class="ti ti-download"></i>다운로드</a>
    </div>`;
  }
  document.getElementById('file-overlay').classList.add('open');
}
function closeFileModal(e){
  if(e&&e.target!==document.getElementById('file-overlay'))return;
  document.getElementById('file-overlay').classList.remove('open');
  document.getElementById('fmodal-body').innerHTML='';
}

/* ================================================================
   LIGHTBOX
================================================================ */
function openLightbox(i){
  lbIdx=i; showLb();
  document.getElementById('lightbox').classList.add('open');
}
function showLb(){
  const ph=D.sketch.photos[lbIdx];
  if(!ph)return;
  document.getElementById('lb-img').src=ph.src;
  document.getElementById('lb-cap').textContent=ph.caption||'';
  document.getElementById('lb-cnt').textContent=`${lbIdx+1} / ${D.sketch.photos.length}`;
}
function lbNav(d){
  lbIdx=(lbIdx+d+D.sketch.photos.length)%D.sketch.photos.length;
  showLb();
}
function closeLightbox(e){
  if(e&&e.target!==document.getElementById('lightbox'))return;
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('lightbox').classList.contains('open')){
    if(e.key==='ArrowLeft')lbNav(-1);
    else if(e.key==='ArrowRight')lbNav(1);
    else if(e.key==='Escape')closeLightbox();
  }
  if(document.getElementById('file-overlay').classList.contains('open')&&e.key==='Escape')closeFileModal();
});

  const hf=a.querySelector('#hero-file');
  if(hf) hf.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    readFile(f).then(d=>{D.basic.heroImage=d;save();renderPreview();renderPanel();});
  });

  // Greeting fields
  a.querySelectorAll('[data-gf]').forEach(el=>{
    el.addEventListener('input',()=>{
      const g=D.greetings.find(x=>x.id==el.dataset.gid);
      if(g){g[el.dataset.gf]=el.value;save();renderPreview();}
    });
  });
  a.querySelectorAll('.gphoto').forEach(el=>{
    el.addEventListener('change',e=>{
      const f=e.target.files[0];if(!f)return;
      const gid=+el.dataset.gid;
      readFile(f).then(d=>{const g=D.greetings.find(x=>x.id===gid);if(g){g.photo=d;save();renderPreview();renderPanel();}});
    });
  });

  // Keynote fields
  a.querySelectorAll('[data-kf]').forEach(el=>{
    el.addEventListener('input',()=>{
      const k=D.keynotes.find(x=>x.id==el.dataset.kid);
      if(k){k[el.dataset.kf]=el.value;save();renderPreview();}
    });
  });
  a.querySelectorAll('.kfile').forEach(el=>{
    el.addEventListener('change',e=>{
      const f=e.target.files[0];if(!f)return;
      const kid=+el.dataset.kid;
      readFile(f).then(d=>{const k=D.keynotes.find(x=>x.id===kid);if(k){k.fileData=d;k.fileName=f.name;k.fileUrl='';save();renderPreview();renderPanel();}});
    });
  });

  // Poster fields
  a.querySelectorAll('[data-pf]').forEach(el=>{
    el.addEventListener('input',()=>{
      const p=D.posters.find(x=>x.id==el.dataset.pid);
      if(p){p[el.dataset.pf]=el.value;save();renderPreview();}
    });
  });
  a.querySelectorAll('.pfile').forEach(el=>{
    el.addEventListener('change',e=>{
      const f=e.target.files[0];if(!f)return;
      const pid=+el.dataset.pid;
      readFile(f).then(d=>{const p=D.posters.find(x=>x.id===pid);if(p){p.fileData=d;p.fileName=f.name;p.fileUrl='';save();renderPreview();renderPanel();}});
    });
  });

  // Sketch photos
  const sf=a.querySelector('#sketch-files');
  if(sf) sf.addEventListener('change',e=>{
    const files=Array.from(e.target.files);
    Promise.all(files.map(readFile)).then(results=>{
      results.forEach(d=>D.sketch.photos.push({src:d,caption:''}));
      save();renderPreview();renderPanel();
    });
  });

  // Photo captions
  a.querySelectorAll('[data-pi]').forEach(el=>{
    el.addEventListener('input',()=>{
      const i=+el.dataset.pi;
      if(D.sketch.photos[i])D.sketch.photos[i].caption=el.value;
      save();renderPreview();
    });
  });
}

<script>

function openFile(foStr,title){
  let fo;try{fo=JSON.parse(foStr);}catch(e){return;}
  if(!fo)return;
  document.getElementById('fm-title').textContent=title||'자료 보기';
  const body=document.getElementById('fm-body');body.innerHTML='';
  let src='',pdf=false,fname='';
  function isPDF(n,d){return(d&&d.startsWith('data:application/pdf'))||(n&&/\\.pdf$/i.test(n));}
  if(fo.type==='url'){src=fo.url;pdf=isPDF(fo.url);fname=fo.name||'파일';}
  else if(fo.type==='b64'){
    const mime=fo.data.split(';')[0].split(':')[1];pdf=mime==='application/pdf';
    const b=atob(fo.data.split(',')[1]),ab=new ArrayBuffer(b.length),ia=new Uint8Array(ab);
    for(let i=0;i<b.length;i++)ia[i]=b.charCodeAt(i);
    src=URL.createObjectURL(new Blob([ab],{type:mime}));fname=fo.name||'파일';
  }
  if(pdf){body.innerHTML='<iframe src="'+src+'#toolbar=1"></iframe>';}
  else{body.innerHTML='<div class="fmodal-dl"><i class="ti ti-file-presentation"></i><p>이 파일 형식은 브라우저에서 바로 볼 수 없습니다.<br>아래 버튼을 눌러 다운로드하세요.</p><a href="'+src+'" download="'+fname+'" target="_blank"><i class="ti ti-download"></i>다운로드</a></div>';}
  document.getElementById('fov').classList.add('open');
}
function closeFM(){document.getElementById('fov').classList.remove('open');document.getElementById('fm-body').innerHTML='';}

function openLightbox(i){lbI=i;showLB();document.getElementById('lb').classList.add('open');}

function lbNav(d){lbI=(lbI+d+PHOTOS.length)%PHOTOS.length;showLB();}
function closeLB(){document.getElementById('lb').classList.remove('open');}
document.addEventListener('keydown',e=>{
  if(document.getElementById('lb').classList.contains('open')){if(e.key==='ArrowLeft')lbNav(-1);else if(e.key==='ArrowRight')lbNav(1);else if(e.key==='Escape')closeLB();}
  if(document.getElementById('fov').classList.contains('open')&&e.key==='Escape')closeFM();
});

const secs=document.querySelectorAll('section[id]');

secs.forEach(s=>obs.observe(s));
links.forEach(l=>l.addEventListener('click',e=>{e.preventDefault();const t=document.querySelector(l.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth'});}));
<\/script>
